name: Universal lock validation
on:
  pull_request:
    paths:
      - 'requirements/**'
      - 'tools/check_lock_delta.py'
      - 'python/tests/test_lock_delta.py'
      - '.github/workflows/lock-validation.yml'
permissions:
  contents: read
jobs:
  locks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - run: python -m pip install --require-hashes -r requirements/lock-check.txt
      - name: Compare the complete lock inventory
        env:
          LOCK_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          python tools/check_lock_delta.py --base "$LOCK_BASE_SHA" --all-locks
      - name: Resolve SDK and tooling locks on Python 3.11
        shell: bash
        run: |
          locks=()
          for lock in requirements/*.txt; do
            [[ "$lock" == requirements/docs.txt ]] || locks+=("$lock")
          done
          python tools/check_lock_delta.py --resolve --python-version 3.11 "${locks[@]}"
      - name: Resolve documentation lock on Python 3.12
        # requirements/docs.in declares a separate Python 3.12 docs toolchain.
        # This does not raise the SDK's >=3.11 support floor.
        run: >-
          python tools/check_lock_delta.py --resolve --python-version 3.12
          requirements/docs.txt
